<div class="field"><label>Почта</label><input id="email" type="email" placeholder="Личная почта"></div><div class="field"><label>Код идентификации</label><div id="identityCode" style="background:#eef4e6;border:1px solid #b8c98a;border-radius:12px;padding:10px;font-family:ui-monospace,monospace;word-break:break-all;color:#58702a;font-weight:700">—</div><button class="btn secondary" style="margin-top:7px" onclick="regenerateCode()">Новый код</button></div><div class="section-title" style="margin-top:25px">Внешний вид</div><div class="field"><button class="btn secondary" style="width:100%" onclick="toggleTheme()">Переключить тему</button></div><div class="field"><label>Аватар</label><label class="pick" for="file"><img id="pickAvatar" class="avatar"><span>Выбрать картинку</span></label><input id="file" type="file" accept="image/*" hidden></div>
<div class="row"><button class="btn" onclick="saveProfile()">Сохранить</button><button class="btn secondary" onclick="closeProfile()">Закрыть</button><button class="btn secondary" style="width:100%;margin-top:4px;color:#ff7777" onclick="logout()"> Завершить сессию</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const defaultAvatar="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='50%' cy='45%' r='65%'><stop offset='0' stop-color='#42e8ff'/><stop offset='0.45' stop-color='#087bff'/><stop offset='1' stop-color='#06152f'/></radialGradient><filter id='glow'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><circle cx='50' cy='50' r='48' fill='#06152f'/><circle cx='50' cy='50' r='43' fill='url(#g)'/><path d='M28 55 Q50 28 72 55 Q50 78 28 55Z' fill='none' stroke='#8ff6ff' stroke-width='3' filter='url(#glow)'/><circle cx='39' cy='53' r='4' fill='#d9fbff'/><circle cx='61' cy='53' r='4' fill='#d9fbff'/><path d='M42 65 Q50 70 58 65' fill='none' stroke='#d9fbff' stroke-width='3' stroke-linecap='round'/><circle cx='50' cy='18' r='3' fill='#a7f8ff' filter='url(#glow)'/></svg>");
let profile=JSON.parse(localStorage.getItem("profile")||"{}"); let avatar=profile.avatar||""; let currentChat="";function getStoredAvatar(name){const n=String(name||"").replace(/^@/,"").toLowerCase();const me=(profile.username||"").replace(/^@/,"").toLowerCase();if(n==="me"||n===me)return avatar||"";const p=JSON.parse(localStorage.getItem("userProfiles")||"{}");return p[n]?.avatar||""}
function makeAvatar(name,isAI=false,isGroup=false){const el=document.createElement("div");el.className="avatar";el.style.display="grid";el.style.placeItems="center";const src=getStoredAvatar(name);if(src){el.style.backgroundImage="url('"+src.replace(/'/g,"\\'")+"')";el.style.backgroundSize="cover";el.style.backgroundPosition="center";el.textContent="";return el}if(isGroup){el.textContent="Г"}else if(name==="Бузя"){el.textContent="/n";el.classList.add("buzy-avatar")}else if(isAI){el.textContent="ИИ"}else{el.textContent="👤"}return el}
 let currentChatIsAI=false; let currentChatIsGroup=false; let aiProfiles=JSON.parse(localStorage.getItem("aiProfiles")||"[]"); let groups=JSON.parse(localStorage.getItem("groups")||"[]");
function saveLocal(){profile={...profile,username:($("username").value||"").trim().replace(/^@/,""),displayName:($("displayName").value||"").trim(),bio:($("bio").value||"").trim(),email:($("email").value||"").trim(),avatar};localStorage.setItem("profile",JSON.stringify(profile));const profiles=JSON.parse(localStorage.getItem("userProfiles")||"{}");if(profile.username)profiles[profile.username.toLowerCase()]={avatar:profile.avatar||""};localStorage.setItem("userProfiles",JSON.stringify(profiles));renderHeader();$("drawerAvatar").src=avatar||defaultAvatar;$("drawerName").textContent=profile.displayName||"Мой профиль";$("drawerBio").textContent=profile.bio||"О себе не заполнено"}
function renderHeader(){$("headName").textContent=profile.displayName||"Мой профиль";$("headSub").textContent=profile.username?"@"+profile.username:"Настрой профиль";$("pickAvatar").src=avatar||defaultAvatar}
function toggleMore(){closePlus();openProfile()}function closeMore(){}function openProfile(){closeMore();closePlus();$("drawerAvatar").src=avatar||defaultAvatar;$("drawerName").textContent=profile.displayName||"Мой профиль";$("drawerBio").textContent=profile.bio||"О себе не заполнено";$("username").value=profile.username||"";$("displayName").value=profile.displayName||"";$("bio").value=profile.bio||"";$("email").value=profile.email||"";$("identityCode").textContent=profile.identityCode||"—";$("drawer").classList.add("open")}
function closeProfile(){$("drawer").classList.remove("open")}
function saveProfile(){saveLocal();closeProfile();go("chats")}function showRegister(){$("loginForm").style.display="none";$("registerForm").style.display="block"}
function showLogin(){$("loginForm").style.display="block";$("registerForm").style.display="none"}
function makeCode(){return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase().match(/.{1,4}/g).join("-")}
function logout(){localStorage.removeItem("sessionActive");closeMore();closeProfile();$("auth").style.display="flex";showLogin();$("authMsg").textContent="Сессия завершена на этом устройстве."}function finishLogin(a){if(!a)return false;try{profile=JSON.parse(localStorage.getItem("profile")||"{}")}catch(e){profile={}}profile.username=a.username||profile.username||"";profile.email=a.email||profile.email||"";profile.identityCode=a.identityCode||profile.identityCode||"";if(!profile.avatar)profile.avatar="";localStorage.setItem("profile",JSON.stringify(profile));localStorage.setItem("sessionActive","1");$("auth").style.display="none";$("authMsg").textContent="";renderHeader();renderChats();return true}
function readAccount(){try{return JSON.parse(localStorage.getItem("account")||"null")}catch(e){return null}}
function registerAccount(){const u=($("regUser").value||"").trim().replace(/^@/,"").toLowerCase(),n=($("regName").value||"").trim(),e=($("regEmail").value||"").trim().toLowerCase(),p=$("regPass").value||"";if(!u||!e||!p){$("authMsg").textContent="Заполни юзер, почту и пароль.";return}const code=makeCode();profile={username:u,displayName:n,email:e,avatar:"",bio:"",identityCode:code};localStorage.setItem("profile",JSON.stringify(profile));localStorage.setItem("account",JSON.stringify({username:u,email:e,password:p,identityCode:code}));const profiles=JSON.parse(localStorage.getItem("userProfiles")||"{}");profiles[u]={avatar:""};localStorage.setItem("userProfiles",JSON.stringify(profiles));finishLogin(JSON.parse(localStorage.getItem("account")))}
function login(){const id=($("loginId").value||"").trim().replace(/^@/,"").toLowerCase(),p=$("loginPass").value||"",a=readAccount();if(!a){$("authMsg").textContent="Аккаунт на этом устройстве не найден. Создай аккаунт.";return}const username=String(a.username||"").toLowerCase(),email=String(a.email||"").toLowerCase();if(!id||!p||p!==String(a.password||"")||(id!==username&&id!==email)){$("authMsg").textContent="Неверный юзер/почта или пароль.";return}finishLogin(a)}
function loginByCode(){const code=($("loginCode").value||"").trim().toUpperCase(),a=readAccount();if(!a){$("authMsg").textContent="Аккаунт на этом устройстве не найден.";return}if(!code||code!==String(a.identityCode||"").toUpperCase()){$("authMsg").textContent="Неверный код.";return}finishLogin(a)}
function togglePlus(){const m=$("plusMenu"),b=document.querySelector('.bottom .nav[onclick="togglePlus()"]'),a=document.querySelector(".app");if(m.style.display==="block"){m.style.display="none";return}closeProfile();closeChatMenu();const r=b.getBoundingClientRect(),ar=a.getBoundingClientRect(),w=190;let left=r.left-ar.left+r.width/2-w/2;left=Math.max(8,Math.min(left,ar.width-w-8));m.style.left=left+"px";m.style.right="auto";m.style.bottom=(ar.bottom-r.top+9)+"px";m.style.display="block"}function closePlus(){$("plusMenu").style.display="none"}
function createAI(){closePlus();let base="Новый ИИ",name=base,i=2;while(aiProfiles.some(x=>x.name.toLowerCase()===name.toLowerCase()))name=base+" "+i++;aiProfiles.push({name});localStorage.setItem("aiProfiles",JSON.stringify(aiProfiles));openChat(name,true)}
function createGroup(){closePlus();const name=(prompt("Название группы")||"").trim().slice(0,40);if(!name)return;if(groups.some(x=>x.name.toLowerCase()===name.toLowerCase())){alert("Группа с таким названием уже есть.");return}const raw=prompt("Участники через запятую, например: @sanya, @alex")||"";const members=raw.split(",").map(x=>x.trim().replace(/^@/,"")).filter(Boolean).slice(0,50);const group={id:"g"+Date.now().toString(36),name,members};groups.push(group);localStorage.setItem("groups",JSON.stringify(groups));openChat(name,false,true)}
function renderFriends(){removeComposer();$("view").innerHTML='<section class="screen"><div class="section-title">Всегда рядом</div><div class="user" onclick="openChat(\'Бузя\',true)"><div class="avatar buzy-avatar" style="display:grid;place-items:center">/n</div><div><b>Бузя</b><div class="muted">ассистент</div></div></div>'+(aiProfiles.length?'<div class="section-title" style="margin-top:24px">Мои ИИ</div>': '')+aiProfiles.map(x=>'<div class="user" onclick="openChat(\''+x.name.replace(/'/g,"\\\\'")+'\',true)"><div class="avatar" style="display:grid;place-items:center"></div><div><b>'+x.name+'</b><div class="muted">бот</div></div></div>').join('')+'<div class="section-title" style="margin-top:24px">Люди</div><button class="btn secondary" style="width:100%" onclick="go(\'search\')"> Найти друга по @username</button></section>'}
function regenerateCode(){profile.identityCode=makeCode();localStorage.setItem("profile",JSON.stringify(profile));const a=JSON.parse(localStorage.getItem("account")||"null");if(a){a.identityCode=profile.identityCode;localStorage.setItem("account",JSON.stringify(a))}const profiles=JSON.parse(localStorage.getItem("userProfiles")||"{}");if(profile.username)profiles[profile.username.toLowerCase()]={avatar};localStorage.setItem("userProfiles",JSON.stringify(profiles));$("identityCode").textContent=profile.identityCode}
let avatarImage=null,avatarScale=1,avatarX=0,avatarY=0,avatarDragging=false,avatarStartX=0,avatarStartY=0,avatarBaseX=0,avatarBaseY=0;
function drawAvatarEditor(){const canvas=$("avatarCanvas"),ctx=canvas.getContext("2d"),s=600;ctx.clearRect(0,0,s,s);ctx.fillStyle="#090b10";ctx.fillRect(0,0,s,s);if(!avatarImage)return;const cover=Math.max(s/avatarImage.width,s/avatarImage.height),scale=cover*avatarScale,w=avatarImage.width*scale,h=avatarImage.height*scale;ctx.drawImage(avatarImage,(s-w)/2+avatarX,(s-h)/2+avatarY,w,h)}
function openAvatarEditor(src){const img=new Image();img.onload=()=>{avatarImage=img;avatarScale=1;avatarX=0;avatarY=0;$("avatarZoom").value=1;drawAvatarEditor();$("avatarEditor").classList.add("open")};img.src=src}
function closeAvatarEditor(){$("avatarEditor").classList.remove("open");avatarImage=null}
$("avatarZoom").oninput=()=>{avatarScale=Number($("avatarZoom").value);drawAvatarEditor()}
$("avatarCanvas").addEventListener("pointerdown",e=>{avatarDragging=true;avatarStartX=e.clientX;avatarStartY=e.clientY;avatarBaseX=avatarX;avatarBaseY=avatarY;$("avatarCanvas").setPointerCapture(e.pointerId)})
$("avatarCanvas").addEventListener("pointermove",e=>{if(!avatarDragging)return;const r=$("avatarCanvas").getBoundingClientRect(),sx=600/r.width,sy=600/r.height;avatarX=avatarBaseX+(e.clientX-avatarStartX)*sx;avatarY=avatarBaseY+(e.clientY-avatarStartY)*sy;drawAvatarEditor()})
$("avatarCanvas").addEventListener("pointerup",()=>avatarDragging=false)
$("avatarCanvas").addEventListener("pointercancel",()=>avatarDragging=false)
function saveAvatarEdit(){if(!avatarImage)return;const out=document.createElement("canvas");out.width=600;out.height=600;out.getContext("2d").drawImage($("avatarCanvas"),0,0);avatar=out.toDataURL("image/jpeg",.9);renderHeader();closeAvatarEditor()}
$("file").onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>openAvatarEditor(r.result);r.readAsDataURL(f);e.target.value=""}
function go(page){closePlus();removeComposer();document.querySelector(".bottom").style.display="flex";if(page==="search")renderSearch();else if(page==="friends")renderFriends();else renderChats();document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));if(page==="friends")$("nFriends").classList.add("active");else if(page==="chats")$("nChats").classList.add("active")}
function renderChats(){
  removeComposer();
  const chats=[];
  const seen=new Set();
  const add=(name,isAI,isGroup=false)=>{
    const key=(isGroup?"group:":"chat:")+name.toLowerCase();
    if(seen.has(key))return;
    const items=loadMessages(name);
    if(items.length||name==="Бузя"||aiProfiles.some(x=>x.name===name)||isGroup){
      seen.add(key);
      chats.push({name,isAI,isGroup,last:items.length?items[items.length-1]:null});
    }
  };
  add("Бузя",true);
  aiProfiles.forEach(x=>add(x.name,true));
  groups.forEach(x=>add(x.name,false,true));
  Object.keys(localStorage).filter(k=>k.indexOf("chat:")===0).forEach(k=>{
    const name=k.slice(5);
    if(name&&!groups.some(g=>g.name.toLowerCase()===name.toLowerCase()))add(name,isAssistant(name));
  });
  if(!chats.length){$("view").innerHTML='<section class="screen"><div class="empty"><b>Пока пусто</b>Найди человека по @username или создай чат.</div></section>';return}
  const section=document.createElement("section");section.className="screen";section.innerHTML='<div class="section-title">Чаты</div>';
  for(const x of chats){
    const row=document.createElement("div");row.className="user";row.onclick=()=>openChat(x.name,x.isAI,x.isGroup);
    const av=makeAvatar(x.name,x.name===profile.username?false:x.isAI,x.isGroup);
    const wrap=document.createElement("div");wrap.style.minWidth="0";
    const title=document.createElement("b");title.textContent=x.isGroup?x.name:"@"+x.name;
    const preview=document.createElement("div");preview.className="muted";preview.style.whiteSpace="nowrap";preview.style.overflow="hidden";preview.style.textOverflow="ellipsis";preview.textContent=x.last?(x.last.type==="photo"?"Фото":x.last.type==="audio"?"Музыка":x.last.type==="file"?"Файл: "+String(x.last.name||"документ"):String(x.last.text||"")):(x.isGroup?"Группа":"Начать диалог");
    wrap.append(title,preview);row.append(av,wrap);section.appendChild(row);
  }
  $("view").replaceChildren(section);
}
function removeComposer(){const old=document.querySelector(".composer");if(old)old.remove()}
function chatKey(u){return "chat:"+u.toLowerCase()}
function loadMessages(u){return JSON.parse(localStorage.getItem(chatKey(u))||"[]")}
function saveMessages(u,items){localStorage.setItem(chatKey(u),JSON.stringify(items))}
function exitChat(){closeChatMenu();renderChats()}
function deleteChatForMe(){localStorage.removeItem(chatKey(currentChat));closeChatMenu();renderChats()}
function deleteChatForEveryone(){localStorage.removeItem(chatKey(currentChat));localStorage.setItem("deleteForEveryone:"+currentChat.toLowerCase(),Date.now().toString());closeChatMenu();renderChats()}
function toggleChatMenu(){$("chatMenu").classList.toggle("open")}
function closeChatMenu(){const m=$("chatMenu");if(m)m.classList.remove("open")}
function renderSearch(){$("view").innerHTML='<section class="screen"><div class="search"><input id="q" placeholder="Найти по юзу…"><button class="btn" onclick="searchUsers()">Найти</button></div><div id="results" class="muted">Введи @username.</div></section>';setTimeout(()=>$("q").focus(),0)}
function searchUsers(){const q=($("q").value||"").trim().replace(/^@/,"").toLowerCase();const r=$("results");if(!q){r.textContent="Введи @username.";return}const row=document.createElement("div");row.className="user";row.onclick=()=>openFound(q);const av=makeAvatar(q,false,false);const wrap=document.createElement("div");const name=document.createElement("b");name.textContent="@"+q;const sub=document.createElement("div");sub.className="muted";sub.textContent="чел.";wrap.append(name,sub);row.append(av,wrap);r.replaceChildren(row)}
function openFound(u){const src=getStoredAvatar(u);$("view").innerHTML='<section class="profile"><div id="foundAvatar" class="avatar bigavatar" style="margin:auto"></div><h2>@'+u+'</h2><div class="muted">Профиль пользователя</div><br><button class="btn" id="foundWrite">Написать</button></section>';const av=$("foundAvatar");if(src){av.style.backgroundImage="url('"+src.replace(/'/g,"\\'")+"')";av.style.backgroundSize="cover";av.style.backgroundPosition="center"}else av.textContent="👤";$("foundWrite").onclick=()=>openChat(u)}
function isAssistant(u){return u==="LLM7"||u==="Бузя"}
function getTag(u,isAI=false){return isAssistant(u)?"ассистент":isAI?"бот":"чел."}
function renameCurrentAI(){if(!currentChatIsAI||isAssistant(currentChat))return;const next=prompt("Новое имя ИИ",currentChat);if(!next)return;const name=next.trim().slice(0,40);if(!name||isAssistant(name))return;const found=aiProfiles.find(x=>x.name===currentChat);if(found)found.name=name;localStorage.setItem("aiProfiles",JSON.stringify(aiProfiles));const oldKey=chatKey(currentChat),items=loadMessages(currentChat);localStorage.setItem(chatKey(name),JSON.stringify(items));if(oldKey!==chatKey(name))localStorage.removeItem(oldKey);currentChat=name;openChat(name,true)}function openChat(u,isAI=false,isGroup=false){
removeComposer();currentChat=u;currentChatIsAI=isAI;currentChatIsGroup=isGroup;closePlus();closeMore();
const saved=loadMessages(u);
$("view").innerHTML='<section id="messages"><div class="chat-head"><div class="chat-meta"><button class="chat-back" onclick="renderChats()" aria-label="Назад">&lt;</button><div><div class="chat-title">@'+u+'</div><div class="chat-sub">'+(getTag(u,isAI))+'</div></div><div class="chat-actions"><button onclick="toggleChatMenu()" aria-label="Действия чата">⋮</button><div id="chatMenu" class="chat-menu"><button id="renameAIButton" class="rename" onclick="renameCurrentAI()"> Переименовать</button><button class="danger" onclick="exitChat()">Выйти из чата</button><button class="danger" onclick="deleteChatForMe()">Удалить чат у себя</button><button class="danger" onclick="deleteChatForEveryone()">Удалить чат у всех</button></div></div></div></div><div id="chatEmpty" class="empty" style="display:'+(saved.length?"none":"block")+'"><b>Начало диалога</b>Здесь пока нет сообщений.</div></section>';
document.querySelector(".bottom").style.display="flex";const renameBtn=$("renameAIButton");if(renameBtn)renameBtn.style.display=(isAI&&!isAssistant(u)&&!isGroup)?"block":"none";
for(const item of saved){if(item.type==="photo")addPhotoMessage(item.src,true);else if(item.type==="audio")addAudioMessage(item.src,item.name,item.mime,true);else if(item.type==="file")addFileMessage(item.src,item.name,item.mime,item.size,true);else addTextMessage(item.text,true)}
const c=document.createElement("div");c.className="composer";c.innerHTML='<button class="attach" title="Фото, музыка или документ" aria-label="Прикрепить файл"></button><input id="photoInput" type="file" accept="image/*,audio/*,.pdf,.doc,.docx,.txt,.rtf,.xls,.xlsx,.ppt,.pptx" hidden><textarea id="text" placeholder="Написать сообщение…" rows="1"></textarea><button id="send"></button>';
document.querySelector(".app").appendChild(c);
const attach=c.querySelector(".attach"), photo=c.querySelector("#photoInput");
attach.onclick=()=>photo.click();
photo.onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>addPhotoMessage(r.result);r.readAsDataURL(f);photo.value=""};
$("send").onclick=()=>{const t=$("text").value.trim();if(t){addTextMessage(t);$("text").value=""}};
$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}});
}
function addTextMessage(t,restoring=false){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className="msg me";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить</button></div><div class="body"></div>';x.querySelector(".body").textContent=t;x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);if(!restoring){const items=loadMessages(currentChat);items.push({type:"text",text:t});saveMessages(currentChat,items)}scrollMessages()}
function addPhotoMessage(src,restoring=false){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className="msg me";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить фото</button></div><img alt="Фото сообщения">';x.querySelector("img").src=src;x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);if(!restoring){const items=loadMessages(currentChat);items.push({type:"photo",src});saveMessages(currentChat,items)}scrollMessages()}
function addAudioMessage(src,name,mime,restoring=false){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className="msg me file-msg";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить файл</button></div><div class="file-card"><div class="file-kind">♫</div><div class="file-info"><b class="file-name"></b><audio controls preload="metadata"></audio></div></div>';x.querySelector(".file-name").textContent=name||"Музыка";x.querySelector("audio").src=src;x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);if(!restoring){const items=loadMessages(currentChat);items.push({type:"audio",src,name:name||"Музыка",mime:mime||"audio/*"});saveMessages(currentChat,items)}scrollMessages()}
function addFileMessage(src,name,mime,size,restoring=false){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className="msg me file-msg";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить файл</button></div><a class="file-card" target="_blank" rel="noopener"><div class="file-kind">▤</div><div class="file-info"><b class="file-name"></b><span class="file-size"></span></div><span class="file-open">Открыть</span></a>';const a=x.querySelector("a");a.href=src;x.querySelector(".file-name").textContent=name||"Документ";x.querySelector(".file-size").textContent=size?formatFileSize(size):"Документ";x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);if(!restoring){const items=loadMessages(currentChat);items.push({type:"file",src,name:name||"Документ",mime:mime||"application/octet-stream",size:size||0});saveMessages(currentChat,items)}scrollMessages()}
function formatFileSize(bytes){if(!bytes)return"";const units=["Б","КБ","МБ","ГБ"];let n=bytes,i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return(n>=10||i===0?n.toFixed(0):n.toFixed(1))+" "+units[i]}
function deleteMessage(el){const nodes=[...$("messages").children].filter(x=>x.classList.contains("msg"));const index=nodes.indexOf(el);el.remove();if(index>=0){const items=loadMessages(currentChat);items.splice(index,1);saveMessages(currentChat,items)}if(!$("messages").querySelector(".msg")){const empty=$("chatEmpty");if(empty)empty.style.display="block"}}
function scrollMessages(){const m=$("messages");m.scrollTop=m.scrollHeight}
document.addEventListener("click",e=>{document.querySelectorAll(".msg.selected").forEach(m=>{if(!m.contains(e.target))m.classList.remove("selected")})});
document.addEventListener("contextmenu",e=>{const m=e.target.closest&&e.target.closest(".msg");if(!m)return;e.preventDefault();m.classList.toggle("selected")});
document.addEventListener("click",e=>{const m=e.target.closest&&e.target.closest(".msg");if(m&&!e.target.closest(".delete-btn"))m.classList.toggle("selected")});document.addEventListener("pointerdown",e=>{const m=e.target.closest&&e.target.closest(".msg");if(!m)return;clearTimeout(m._pressTimer);m._pressTimer=setTimeout(()=>m.classList.add("selected"),450)});document.addEventListener("pointerup",e=>{const m=e.target.closest&&e.target.closest(".msg");if(m)clearTimeout(m._pressTimer)});
renderHeader();if(localStorage.getItem("sessionActive")==="1"&&localStorage.getItem("account")){$("auth").style.display="none";renderChats()}else{$("auth").style.display="flex"}

</script>
<script id="theme-script">
(function(){const dark=localStorage.getItem("theme")==="dark";document.documentElement.classList.toggle("dark",dark)})();
function toggleTheme(){const dark=document.documentElement.classList.toggle("dark");localStorage.setItem("theme",dark?"dark":"light")}
</script></body></html>
