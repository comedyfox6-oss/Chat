<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чат</title>

<style>
:root{--bg:#0b0d12;--panel:#12151d;--panel2:#181c26;--line:#272c38;--text:#f5f7fb;--muted:#8992a3;--accent:#6678f5}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}.app{width:min(780px,100%);height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
header{height:72px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(18,21,29,.88);backdrop-filter:blur(22px);position:relative;z-index:5}
.icon{border:0;background:transparent;color:#cbd1dc;font-size:21px;padding:8px;border-radius:12px;cursor:pointer;transition:.16s}.icon:hover{background:#202531;color:#fff}.icon:active{transform:scale(.94)}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#292f3c;display:grid;place-items:center;font-size:20px;flex:none;border:1px solid #343a49}
.headtext{min-width:0;flex:1}.name{font-weight:760;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.view{flex:1;min-height:0;overflow:auto}.screen{padding:24px 16px}.search{display:flex;gap:9px;margin-bottom:18px}.search input{flex:1}.card,input{border:1px solid #303645;background:#10131a;color:#fff;border-radius:15px;padding:12px 13px;font:inherit;outline:none;transition:.16s}.card:hover{border-color:#3a4252}.card:focus,input:focus{border-color:#5668d9}.user{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,#141821,#11141b);margin:8px 0;cursor:pointer;transition:.16s}.user:hover{background:#191e28;border-color:#353d4d;transform:translateY(-1px)}
.muted{color:var(--muted);font-size:13px}.bigavatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#292f3c}.profile{text-align:center;padding:34px 18px}.drawer-profile{text-align:center;padding:8px 0 24px}.drawer-avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#292f3c;border:2px solid #343a49;display:block;margin:0 auto 14px}.drawer-profile h2{margin:0 0 5px;font-size:22px}.drawer-profile .muted{max-width:310px;margin:0 auto;line-height:1.45}.profile h2{margin:14px 0 3px}.btn{border:0;border-radius:13px;background:var(--accent);color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.secondary{background:#292f3a}.field{margin:15px 0;text-align:left}.field label{display:block;color:#9ca5b5;font-size:12px;margin-bottom:7px}.field input{width:100%}
#messages{height:100%;overflow:auto;padding:22px 14px 12px;display:flex;flex-direction:column;gap:8px}.msg{max-width:78%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4;position:relative}.me{align-self:flex-end;background:#596be8;border-bottom-right-radius:6px}.them{align-self:flex-start;background:#252a35;border-bottom-left-radius:6px}.msg img{display:block;max-width:100%;max-height:320px;border-radius:12px}.msg-actions{position:absolute;right:5px;top:-35px;display:none;background:#20242e;border:1px solid #3b4150;border-radius:11px;padding:4px;z-index:2}.msg.selected .msg-actions{display:block}.delete-btn{border:0;background:none;color:#ff7777;padding:7px 9px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
.composer{padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#12151d;display:flex;gap:8px;align-items:end}.attach{width:44px;height:44px;border:0;border-radius:14px;background:#252a35;color:#fff;font-size:21px;cursor:pointer}#text{flex:1;min-height:44px;max-height:140px;resize:none;border:1px solid #303645;border-radius:18px;background:#0e1117;color:#fff;padding:11px 14px;font:inherit;outline:none}#send{width:46px;height:44px}
.bottom{height:68px;border-top:1px solid var(--line);background:rgba(18,21,29,.96);backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center}.nav{background:none;color:#737d8e;border:0;font-size:11px;cursor:pointer;min-width:70px;padding:7px 10px;border-radius:14px;transition:.16s}.nav b{display:block;font-size:18px;margin-bottom:3px}.nav.active{color:#fff;background:#1d2230}.nav:hover{color:#dfe3ec}
.drawer{position:absolute;inset:0;display:none;background:rgba(0,0,0,.62);z-index:20;backdrop-filter:blur(3px)}.drawer.open{display:block}.panel{width:min(390px,92%);height:100%;background:#11141b;border-right:1px solid var(--line);padding:26px 20px;box-shadow:8px 0 35px #0009;overflow:auto}.panel h2{margin:0 0 24px}.row{display:flex;gap:8px;flex-wrap:wrap}.pick{cursor:pointer;display:flex;align-items:center;gap:10px}.empty{text-align:center;color:#737d8e;padding:75px 20px}.empty b{display:block;color:#e8ebf2;font-size:19px;margin-bottom:7px;letter-spacing:-.01em}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#727b8c;margin:0 4px 10px}
#moreMenu,#plusMenu{box-shadow:0 14px 40px #000b!important;backdrop-filter:blur(18px)}.menu{position:absolute;right:14px;top:60px;display:none;z-index:8;background:#171b24;border:1px solid #343a49;border-radius:16px;padding:7px;width:190px}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#fff;padding:11px 10px;border-radius:11px;cursor:pointer;font:inherit}.menu button:hover{background:#222834}.chat-head{padding:13px 14px 2px}.chat-meta{display:flex;align-items:center;gap:10px}.chat-meta .avatar{width:38px;height:38px}.chat-tag{display:inline-flex;margin-top:3px;padding:3px 7px;border-radius:7px;background:#262c38;color:#9da7b8;font-size:10px}.chat-title{font-weight:750}.chat-sub{font-size:12px;color:#778193}.chat-actions{margin-left:auto;position:relative}.chat-actions button{border:0;background:transparent;color:#aeb6c5;font-size:21px;padding:6px 9px;border-radius:10px;cursor:pointer}.chat-actions button:hover{background:#222834;color:#fff}.chat-menu{position:absolute;right:0;top:42px;width:190px;background:#171b24;border:1px solid #343a49;border-radius:14px;padding:6px;display:none;z-index:6;box-shadow:0 14px 40px #000b}.chat-menu.open{display:block}.chat-menu button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:10px;border-radius:9px;font:inherit;cursor:pointer}.chat-menu button:hover{background:#222834}.chat-menu .danger{color:#ff8585}.chat-menu .rename{color:#dfe3ff}
.avatar-editor{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);padding:18px}.avatar-editor.open{display:flex}.avatar-editor-box{width:min(430px,100%);background:#141821;border:1px solid #343a49;border-radius:22px;padding:16px;box-shadow:0 20px 70px #000b}.avatar-editor-title{font-size:18px;font-weight:760;margin:2px 4px 14px}.avatar-crop{width:min(360px,82vw);aspect-ratio:1;margin:auto;border-radius:50%;overflow:hidden;background:#090b10;border:2px solid #fff;touch-action:none}.avatar-crop canvas{width:100%;height:100%;display:block;cursor:grab}.zoom-row{display:flex;align-items:center;gap:10px;margin:16px 4px 10px}.zoom-row span{font-size:12px;color:var(--muted)}.zoom-row input{flex:1;padding:0;height:34px;accent-color:var(--accent)}.avatar-editor-actions{display:flex;gap:8px}.avatar-editor-actions .btn{flex:1}</style>
</head>
<body>
<div id="auth" style="position:absolute;inset:0;background:#10131a;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px"><div style="width:min(420px,100%);background:#181b24;border:1px solid #292d38;border-radius:20px;padding:22px"><h1 style="margin-top:0">Вход</h1><p class="muted">После входа устройство запоминается.</p><div id="loginForm"><div class="field"><label>Юзер или почта</label><input id="loginId" placeholder="@username или почта"></div><div class="field"><label>Пароль</label><input id="loginPass" type="password" placeholder="Пароль"></div><button class="btn" style="width:100%" onclick="login()">Войти</button><div class="field"><label>Код идентификации</label><input id="loginCode" placeholder="XXXX-XXXX-XXXX"></div><button class="btn secondary" style="width:100%" onclick="loginByCode()">Войти по коду</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="showRegister()">Создать аккаунт</button></div><div id="registerForm" style="display:none"><div class="field"><label>Юзер</label><input id="regUser" placeholder="@username"></div><div class="field"><label>Имя</label><input id="regName" placeholder="Как тебя называть"></div><div class="section-title" style="margin-top:25px">Аккаунт</div><div class="field"><label>Почта</label><input id="regEmail" type="email" placeholder="Личная почта"></div><div class="field"><label>Пароль</label><input id="regPass" type="password" placeholder="Пароль"></div><button class="btn" style="width:100%" onclick="registerAccount()">Создать аккаунт</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="showLogin()">Назад</button></div><div id="authMsg" class="muted"></div></div></div><div class="app">
<header><button class="icon" onclick="go('search')">⌕</button><img id="headAvatar" class="avatar"><div class="headtext"><div class="name" id="headName">Мой профиль</div><div class="sub" id="headSub">Настрой профиль</div></div><button class="icon" onclick="toggleMore()">⋮</button></header>
<main id="view" class="view"></main>
<div id="plusMenu" style="position:absolute;left:0;bottom:74px;display:none;z-index:30;background:#171b24;border:1px solid #343a49;border-radius:16px;padding:7px;width:190px;box-shadow:0 14px 40px #000b"><button class="delete-btn" style="display:block;width:100%;text-align:left;color:#fff" onclick="createAI()">✨ Создать ИИ</button><button class="delete-btn" style="display:block;width:100%;text-align:left;color:#fff" onclick="go(&quot;search&quot;);closePlus()">👤 Найти друга</button></div>
<div id="moreMenu" class="menu"><button onclick="openProfile()">Профиль</button></div><nav class="bottom"><button class="nav" onclick="togglePlus()"><b>＋</b>Добавить</button><button id="nFriends" class="nav" onclick="go('friends')"><b>👥</b>Друзья</button><button id="nChats" class="nav active" onclick="go('chats')"><b>💬</b>Чаты</button><button id="nMe" class="nav" onclick="openProfile()"><b>●</b>Профиль</button></nav>
</div>

<div id="avatarEditor" class="avatar-editor" onclick="if(event.target===this)closeAvatarEditor()"><div class="avatar-editor-box"><div class="avatar-editor-title">Настрой аватар</div><div class="avatar-crop"><canvas id="avatarCanvas" width="600" height="600"></canvas></div><div class="zoom-row"><span>−</span><input id="avatarZoom" type="range" min="1" max="3" step="0.01" value="1"><span>＋</span></div><div class="avatar-editor-actions"><button class="btn secondary" onclick="closeAvatarEditor()">Отмена</button><button class="btn" onclick="saveAvatarEdit()">Готово</button></div></div></div><div id="drawer" class="drawer" onclick="if(event.target===this)closeProfile()"><div class="panel">
<div class="drawer-profile"><img id="drawerAvatar" class="drawer-avatar"><h2 id="drawerName">Мой профиль</h2><div id="drawerBio" class="muted">О себе не заполнено</div></div><div class="section-title">Личные данные</div>
<div class="field"><label>Юзер</label><input id="username" maxlength="32" placeholder="@username"></div>
<div class="field"><label>Имя</label><input id="displayName" maxlength="40" placeholder="Как тебя называть"></div>
<div class="field"><label>О себе</label><input id="bio" maxlength="120" placeholder="Пара слов"></div>
<div class="field"><label>Почта</label><input id="email" type="email" placeholder="Личная почта"></div><div class="field"><label>Код идентификации</label><div id="identityCode" style="background:#10131a;border:1px solid #353b49;border-radius:12px;padding:10px;font-family:ui-monospace,monospace;word-break:break-all">—</div><button class="btn secondary" style="margin-top:7px" onclick="regenerateCode()">Новый код</button></div><div class="section-title" style="margin-top:25px">Внешний вид</div><div class="field"><label>Аватар</label><label class="pick" for="file"><img id="pickAvatar" class="avatar"><span>Выбрать картинку</span></label><input id="file" type="file" accept="image/*" hidden></div>
<div class="row"><button class="btn" onclick="saveProfile()">Сохранить</button><button class="btn secondary" onclick="closeProfile()">Закрыть</button><button class="btn secondary" style="width:100%;margin-top:4px;color:#ff7777" onclick="logout()">⎋ Завершить сессию</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const defaultAvatar="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' rx='50' fill='#303644'/><text x='50%' y='59%' text-anchor='middle' font-size='46'>🫵</text></svg>");
let profile=JSON.parse(localStorage.getItem("profile")||"{}"); let avatar=profile.avatar||""; let currentChat=""; let currentChatIsAI=false; let aiProfiles=JSON.parse(localStorage.getItem("aiProfiles")||"[]");
function saveLocal(){profile={...profile,username:($("username").value||"").trim().replace(/^@/,""),displayName:($("displayName").value||"").trim(),bio:($("bio").value||"").trim(),email:($("email").value||"").trim(),avatar};localStorage.setItem("profile",JSON.stringify(profile));renderHeader();$("drawerAvatar").src=avatar||defaultAvatar;$("drawerName").textContent=profile.displayName||"Мой профиль";$("drawerBio").textContent=profile.bio||"О себе не заполнено"}
function renderHeader(){$("headName").textContent=profile.displayName||"Мой профиль";$("headSub").textContent=profile.username?"@"+profile.username:"Настрой профиль";$("headAvatar").src=avatar||defaultAvatar;$("pickAvatar").src=avatar||defaultAvatar}
function toggleMore(){closePlus();$("moreMenu").style.display=$("moreMenu").style.display==="block"?"none":"block"}function closeMore(){$("moreMenu").style.display="none"}function openProfile(){closeMore();closePlus();$("drawerAvatar").src=avatar||defaultAvatar;$("drawerName").textContent=profile.displayName||"Мой профиль";$("drawerBio").textContent=profile.bio||"О себе не заполнено";$("username").value=profile.username||"";$("displayName").value=profile.displayName||"";$("bio").value=profile.bio||"";$("email").value=profile.email||"";$("identityCode").textContent=profile.identityCode||"—";$("drawer").classList.add("open")}
function closeProfile(){$("drawer").classList.remove("open")}
function saveProfile(){saveLocal();closeProfile();go("chats")}function showRegister(){$("loginForm").style.display="none";$("registerForm").style.display="block"}
function showLogin(){$("loginForm").style.display="block";$("registerForm").style.display="none"}
function makeCode(){return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase().match(/.{1,4}/g).join("-")}
function logout(){localStorage.removeItem("sessionActive");closeMore();closeProfile();$("auth").style.display="flex";showLogin();$("authMsg").textContent="Сессия завершена на этом устройстве."}function registerAccount(){const u=$("regUser").value.trim().replace(/^@/,"").toLowerCase(),n=$("regName").value.trim(),e=$("regEmail").value.trim().toLowerCase(),p=$("regPass").value;if(!u||!e||!p){$("authMsg").textContent="Заполни юзер, почту и пароль.";return}const code=makeCode();profile={username:u,displayName:n,email:e,avatar:"",bio:"",identityCode:code};localStorage.setItem("profile",JSON.stringify(profile));localStorage.setItem("account",JSON.stringify({username:u,email:e,password:p,identityCode:code}));localStorage.setItem("sessionActive","1");$("auth").style.display="none";renderHeader();renderChats()}
function login(){const id=$("loginId").value.trim().replace(/^@/,"").toLowerCase(),p=$("loginPass").value,a=JSON.parse(localStorage.getItem("account")||"null");if(!a||p!==a.password||(id!==a.username&&id!==a.email)){$("authMsg").textContent="Неверные данные.";return}localStorage.setItem("sessionActive","1");$("auth").style.display="none";renderHeader();renderChats()}
function loginByCode(){const code=$("loginCode").value.trim().toUpperCase(),a=JSON.parse(localStorage.getItem("account")||"null");if(!a||code!==a.identityCode){$("authMsg").textContent="Неверный код.";return}localStorage.setItem("sessionActive","1");$("auth").style.display="none";renderHeader();renderChats()}
function togglePlus(){$("plusMenu").style.display=$("plusMenu").style.display==="block"?"none":"block"}function closePlus(){$("plusMenu").style.display="none"}
function createAI(){closePlus();let base="Новый ИИ",name=base,i=2;while(aiProfiles.some(x=>x.name.toLowerCase()===name.toLowerCase()))name=base+" "+i++;aiProfiles.push({name});localStorage.setItem("aiProfiles",JSON.stringify(aiProfiles));openChat(name,true)}
function renderFriends(){removeComposer();$("view").innerHTML='<section class="screen"><div class="section-title">Всегда рядом</div><div class="user" onclick="openChat(\'Харлоу\',true)"><div class="avatar" style="display:grid;place-items:center">🧠</div><div><b>Харлоу</b><div class="muted">ассистент</div></div></div>'+(aiProfiles.length?'<div class="section-title" style="margin-top:24px">Мои ИИ</div>': '')+aiProfiles.map(x=>'<div class="user" onclick="openChat(\''+x.name.replace(/'/g,"\\\\'")+'\',true)"><div class="avatar" style="display:grid;place-items:center">✨</div><div><b>'+x.name+'</b><div class="muted">бот</div></div></div>').join('')+'<div class="section-title" style="margin-top:24px">Люди</div><button class="btn secondary" style="width:100%" onclick="go(\'search\')">👤 Найти друга по @username</button></section>'}
function regenerateCode(){profile.identityCode=makeCode();localStorage.setItem("profile",JSON.stringify(profile));const a=JSON.parse(localStorage.getItem("account")||"null");if(a){a.identityCode=profile.identityCode;localStorage.setItem("account",JSON.stringify(a))}$("identityCode").textContent=profile.identityCode}
let avatarImage=null,avatarScale=1,avatarX=0,avatarY=0,avatarDragging=false,avatarStartX=0,avatarStartY=0,avatarBaseX=0,avatarBaseY=0;
function drawAvatarEditor(){const canvas=$("avatarCanvas"),ctx=canvas.getContext("2d"),s=600;ctx.clearRect(0,0,s,s);ctx.fillStyle="#090b10";ctx.fillRect(0,0,s,s);if(!avatarImage)return;const cover=Math.max(s/avatarImage.width,s/avatarImage.height),scale=cover*avatarScale,w=avatarImage.width*scale,h=avatarImage.height*scale;ctx.drawImage(avatarImage,(s-w)/2+avatarX,(s-h)/2+avatarY,w,h)}
function openAvatarEditor(src){const img=new Image();img.onload=()=>{avatarImage=img;avatarScale=1;avatarX=0;avatarY=0;$("avatarZoom").value=1;drawAvatarEditor();$("avatarEditor").classList.add("open")};img.src=src}
function closeAvatarEditor(){$("avatarEditor").classList.remove("open");avatarImage=null}
$("avatarZoom").oninput=()=>{avatarScale=Number($("avatarZoom").value);drawAvatarEditor()}
$("avatarCanvas").addEventListener("pointerdown",e=>{avatarDragging=true;avatarStartX=e.clientX;avatarStartY=e.clientY;avatarBaseX=avatarX;avatarBaseY=avatarY;$("avatarCanvas").setPointerCapture(e.pointerId)})
$("avatarCanvas").addEventListener("pointermove",e=>{if(!avatarDragging)return;const r=$("avatarCanvas").getBoundingClientRect(),sx=600/r.width,sy=600/r.height;avatarX=avatarBaseX+(e.clientX-avatarStartX)*sx;avatarY=avatarBaseY+(e.clientY-avatarStartY)*sy;drawAvatarEditor()})
$("avatarCanvas").addEventListener("pointerup",()=>avatarDragging=false)
$("avatarCanvas").addEventListener("pointercancel",()=>avatarDragging=false)
function saveAvatarEdit(){if(!avatarImage)return;const out=document.createElement("canvas");out.width=600;out.height=600;out.getContext("2d").drawImage($("avatarCanvas"),0,0);avatar=out.toDataURL("image/jpeg",.9);renderHeader();closeAvatarEditor()}
$("file").onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>openAvatarEditor(r.result);r.readAsDataURL(f);e.target.value=""}
function go(page){removeComposer();document.querySelector(".bottom").style.display="flex";if(page==="search")renderSearch();else if(page==="friends")renderFriends();else renderChats();document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));if(page==="friends")$("nFriends").classList.add("active");else if(page==="chats")$("nChats").classList.add("active")}
function renderChats(){removeComposer();$("view").innerHTML='<section class="screen"><div class="empty"><b>Пока пусто</b>Найди человека по @username или создай своего ИИ.</div></section>'}
function removeComposer(){const old=document.querySelector(".composer");if(old)old.remove()}
function chatKey(u){return "chat:"+u.toLowerCase()}
function loadMessages(u){return JSON.parse(localStorage.getItem(chatKey(u))||"[]")}
function saveMessages(u,items){localStorage.setItem(chatKey(u),JSON.stringify(items))}
function deleteChatForMe(){localStorage.removeItem(chatKey(currentChat));closeChatMenu();renderChats()}
function deleteChatForEveryone(){localStorage.removeItem(chatKey(currentChat));localStorage.setItem("deleteForEveryone:"+currentChat.toLowerCase(),Date.now().toString());closeChatMenu();renderChats()}
function toggleChatMenu(){$("chatMenu").classList.toggle("open")}
function closeChatMenu(){const m=$("chatMenu");if(m)m.classList.remove("open")}
function renderSearch(){$("view").innerHTML='<section class="screen"><div class="search"><input id="q" placeholder="Найти по юзу…"><button class="btn" onclick="searchUsers()">Найти</button></div><div id="results" class="muted">Введи @username.</div></section>';setTimeout(()=>$("q").focus(),0)}
function searchUsers(){const q=($("q").value||"").trim().replace(/^@/,"").toLowerCase();const r=$("results");if(!q){r.textContent="Введи @username.";return}r.innerHTML='<div class="user" onclick="openFound(\''+q+'\')"><img class="avatar" src="'+defaultAvatar+'"><div><b>@'+q+'</b><div class="muted">чел.</div></div></div>'}
function openFound(u){$("view").innerHTML='<section class="profile"><img class="bigavatar" src="'+defaultAvatar+'"><h2>@'+u+'</h2><div class="muted">Профиль пользователя</div><br><button class="btn" onclick="openChat(\''+u+'\')">Написать</button></section>'}
function isAssistant(u){return u==="LLM7"||u==="Харлоу"}
function getTag(u,isAI=false){return isAssistant(u)?"ассистент":isAI?"бот":"чел."}
function renameCurrentAI(){if(!currentChatIsAI||isAssistant(currentChat))return;const next=prompt("Новое имя ИИ",currentChat);if(!next)return;const name=next.trim().slice(0,40);if(!name||isAssistant(name))return;const found=aiProfiles.find(x=>x.name===currentChat);if(found)found.name=name;localStorage.setItem("aiProfiles",JSON.stringify(aiProfiles));const oldKey=chatKey(currentChat),items=loadMessages(currentChat);localStorage.setItem(chatKey(name),JSON.stringify(items));if(oldKey!==chatKey(name))localStorage.removeItem(oldKey);currentChat=name;openChat(name,true)}function openChat(u,isAI=false){
removeComposer();currentChat=u;currentChatIsAI=isAI;closePlus();closeMore();
const saved=loadMessages(u);
$("view").innerHTML='<section id="messages"><div class="chat-head"><div class="chat-meta"><div><div class="chat-title">@'+u+'</div><div class="chat-sub">'+(getTag(u,isAI))+'</div></div><div class="chat-actions"><button onclick="toggleChatMenu()">⋮</button><div id="chatMenu" class="chat-menu"><button id="renameAIButton" class="rename" onclick="renameCurrentAI()">✏️ Переименовать</button><button class="danger" onclick="deleteChatForMe()">Удалить чат у себя</button><button class="danger" onclick="deleteChatForEveryone()">Удалить чат у всех</button></div></div></div></div><div id="chatEmpty" class="empty" style="display:'+(saved.length?"none":"block")+'"><b>Начало диалога</b>Здесь пока нет сообщений.</div></section>';
document.querySelector(".bottom").style.display="none";const renameBtn=$("renameAIButton");if(renameBtn)renameBtn.style.display=(isAI&&!isAssistant(u))?"block":"none";
for(const item of saved){item.type==="photo"?addPhotoMessage(item.src,true):addTextMessage(item.text,true)}
const c=document.createElement("div");c.className="composer";c.innerHTML='<button class="attach" title="Фото">＋</button><input id="photoInput" type="file" accept="image/*" hidden><textarea id="text" placeholder="Написать сообщение…" rows="1"></textarea><button id="send">➤</button>';
document.querySelector(".app").appendChild(c);
const attach=c.querySelector(".attach"), photo=c.querySelector("#photoInput");
attach.onclick=()=>photo.click();
photo.onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>addPhotoMessage(r.result);r.readAsDataURL(f);photo.value=""};
$("send").onclick=()=>{const t=$("text").value.trim();if(t){addTextMessage(t);$("text").value=""}};
$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}});
}
function addTextMessage(t,restoring=false){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className="msg me";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить</button></div><div class="body"></div>';x.querySelector(".body").textContent=t;x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);if(!restoring){const items=loadMessages(currentChat);items.push({type:"text",text:t});saveMessages(currentChat,items)}scrollMessages()}
function addPhotoMessage(src,restoring=false){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className="msg me";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить фото</button></div><img alt="Фото сообщения">';x.querySelector("img").src=src;x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);if(!restoring){const items=loadMessages(currentChat);items.push({type:"photo",src});saveMessages(currentChat,items)}scrollMessages()}
function deleteMessage(el){const nodes=[...$("messages").children].filter(x=>x.classList.contains("msg"));const index=nodes.indexOf(el);el.remove();if(index>=0){const items=loadMessages(currentChat);items.splice(index,1);saveMessages(currentChat,items)}if(!$("messages").querySelector(".msg")){const empty=$("chatEmpty");if(empty)empty.style.display="block"}}
function scrollMessages(){const m=$("messages");m.scrollTop=m.scrollHeight}
document.addEventListener("click",e=>{document.querySelectorAll(".msg.selected").forEach(m=>{if(!m.contains(e.target))m.classList.remove("selected")})});
document.addEventListener("contextmenu",e=>{const m=e.target.closest&&e.target.closest(".msg");if(!m)return;e.preventDefault();m.classList.toggle("selected")});
document.addEventListener("click",e=>{const m=e.target.closest&&e.target.closest(".msg");if(m&&!e.target.closest(".delete-btn"))m.classList.toggle("selected")});
renderHeader();if(localStorage.getItem("sessionActive")==="1"&&localStorage.getItem("account")){$("auth").style.display="none";renderChats()}else{$("auth").style.display="flex"}
document.addEventListener("click",e=>{const menu=$("moreMenu");if(menu&&menu.style.display==="block"&&!e.target.closest("#moreMenu")&&!e.target.closest("header .icon"))closeMore()});
</script>
</body></html>
