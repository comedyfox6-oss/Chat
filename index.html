<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чат</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d0f14;color:#f4f5f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}.app{width:min(760px,100%);height:100dvh;background:#151821;display:flex;flex-direction:column;overflow:hidden;position:relative}
header{height:64px;display:flex;align-items:center;gap:11px;padding:8px 14px;border-bottom:1px solid #292d38;background:#181b24}
.icon{border:0;background:none;color:#dfe3eb;font-size:22px;padding:6px;cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#303644;display:grid;place-items:center;font-size:20px;flex:none}
.headtext{min-width:0;flex:1}.name{font-weight:750;font-size:16px}.sub{font-size:12px;color:#8f98a9}
.view{flex:1;min-height:0;overflow:auto}.screen{padding:18px 14px}.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1}.card,input{border:1px solid #353b49;background:#10131a;color:#fff;border-radius:13px;padding:11px;font:inherit}.user{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:#20242e;margin:7px 0;cursor:pointer}.user:hover{background:#282d38}.user .avatar{width:46px;height:46px}.muted{color:#8f98a9;font-size:13px}.bigavatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#303644}.profile{text-align:center;padding:25px 10px}.profile h2{margin:12px 0 4px}.btn{border:0;border-radius:12px;background:#5b70ed;color:white;padding:11px 15px;font-weight:700;cursor:pointer}.secondary{background:#303643}.field{margin:13px 0;text-align:left}.field label{display:block;color:#9fa8b8;font-size:12px;margin-bottom:6px}.field input{width:100%}
#messages{height:100%;overflow:auto;padding:18px 13px 10px;display:flex;flex-direction:column;gap:8px}.msg{max-width:80%;padding:9px 12px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35;position:relative}.me{align-self:flex-end;background:#5369e9;border-bottom-right-radius:5px}.them{align-self:flex-start;background:#292e39;border-bottom-left-radius:5px}.msg img{display:block;max-width:100%;max-height:320px;border-radius:12px;object-fit:contain}.meta{font-size:10px;opacity:.55;margin-top:3px}.msg-actions{position:absolute;right:5px;top:-34px;display:none;background:#20242e;border:1px solid #3b4150;border-radius:10px;padding:4px;box-shadow:0 5px 18px #0008;z-index:2}.msg.selected .msg-actions{display:block}.delete-btn{border:0;background:none;color:#ff7070;padding:7px 9px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
.composer{padding:9px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #292d38;background:#181b24;display:flex;gap:8px;align-items:end}.attach{width:44px;height:44px;border:0;border-radius:50%;background:#303643;color:#fff;font-size:20px;cursor:pointer}#text{flex:1;min-height:44px;max-height:140px;resize:none;border:1px solid #353b49;border-radius:19px;background:#10131a;color:#fff;padding:11px 14px;font:inherit;outline:none}#send{width:46px;height:44px}
.bottom{height:58px;border-top:1px solid #292d38;background:#181b24;display:flex;justify-content:space-around;align-items:center}.nav{background:none;color:#8f98a9;border:0;font-size:12px;cursor:pointer}.nav b{display:block;font-size:20px}.nav.active{color:#fff}
.drawer{position:absolute;inset:0;display:none;background:#0008;z-index:5}.drawer.open{display:block}.panel{width:min(350px,90%);height:100%;background:#171a22;padding:18px;box-shadow:8px 0 30px #0008}.panel h2{margin:0 0 18px}.row{display:flex;gap:8px;flex-wrap:wrap}.pick{cursor:pointer;display:flex;align-items:center;gap:10px}.empty{text-align:center;color:#858e9e;padding:55px 20px}.empty b{display:block;color:#cfd4de;font-size:20px;margin-bottom:6px}
</style>
</head>
<body>
<div id="auth" style="position:absolute;inset:0;background:#10131a;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px"><div style="width:min(420px,100%);background:#181b24;border:1px solid #292d38;border-radius:20px;padding:22px"><h1>Вход</h1><p class="muted">После входа устройство запоминается.</p><div id="loginForm"><div class="field"><label>Юзер или почта</label><input id="loginId" placeholder="@username или почта"></div><div class="field"><label>Пароль</label><input id="loginPass" type="password" placeholder="Пароль"></div><button class="btn" style="width:100%" onclick="login()">Войти</button><div class="field"><label>Код идентификации</label><input id="loginCode" placeholder="XXXX-XXXX-XXXX"></div><button class="btn secondary" style="width:100%" onclick="loginByCode()">Войти по коду</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="showRegister()">Создать аккаунт</button></div><div id="registerForm" style="display:none"><div class="field"><label>Юзер</label><input id="regUser" placeholder="@username"></div><div class="field"><label>Имя</label><input id="regName" placeholder="Как тебя называть"></div><div class="field"><label>Почта</label><input id="regEmail" type="email" placeholder="Личная почта"></div><div class="field"><label>Пароль</label><input id="regPass" type="password" placeholder="Пароль"></div><button class="btn" style="width:100%" onclick="registerAccount()">Создать аккаунт</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="showLogin()">Назад</button></div><div id="authMsg" class="muted"></div></div></div><div class="app">
<header><button class="icon" onclick="go('search')">⌕</button><img id="headAvatar" class="avatar"><div class="headtext"><div class="name" id="headName">Мой профиль</div><div class="sub" id="headSub">Настрой профиль</div></div><button class="icon" onclick="toggleMore()">⋮</button></header>
<main id="view" class="view"></main>
<nav class="bottom"><button class="nav" onclick="togglePlus()"><b>＋</b>Добавить</button><button id="nChats" class="nav active" onclick="go('chats')"><b>💬</b>Чаты</button><button id="nSearch" class="nav" onclick="go('search')"><b>⌕</b>Юзеры</button><button id="nMe" class="nav" onclick="openProfile()"><b>●</b>Профиль</button></nav>
</div>

<div id="plusMenu" style="position:absolute;right:12px;bottom:70px;display:none;z-index:8;background:#20242e;border:1px solid #353b49;border-radius:16px;padding:7px;width:190px"><button class="delete-btn" style="display:block;width:100%;text-align:left;color:#fff" onclick="createAI()">🤖 Создать ИИ</button><button class="delete-btn" style="display:block;width:100%;text-align:left;color:#fff" onclick="go(&quot;search&quot;);closePlus()">👤 Найти друга</button></div><div id="drawer" class="drawer" onclick="if(event.target===this)closeProfile()"><div class="panel">
<h2>Профиль</h2>
<div class="field"><label>Юзер</label><input id="username" maxlength="32" placeholder="@username"></div>
<div class="field"><label>Имя</label><input id="displayName" maxlength="40" placeholder="Как тебя называть"></div>
<div class="field"><label>О себе</label><input id="bio" maxlength="120" placeholder="Пара слов"></div>
<div class="field"><label>Почта</label><input id="email" type="email" placeholder="Личная почта"></div><div class="field"><label>Код идентификации</label><div id="identityCode" style="background:#10131a;border:1px solid #353b49;border-radius:12px;padding:10px;font-family:ui-monospace,monospace;word-break:break-all">—</div><button class="btn secondary" style="margin-top:7px" onclick="regenerateCode()">Новый код</button></div><div class="field"><label>Аватар</label><label class="pick" for="file"><img id="pickAvatar" class="avatar"><span>Выбрать картинку</span></label><input id="file" type="file" accept="image/*" hidden></div>
<div class="row"><button class="btn" onclick="saveProfile()">Сохранить</button><button class="btn secondary" onclick="closeProfile()">Закрыть</button><button class="btn secondary" style="width:100%;margin-top:4px;color:#ff7777" onclick="logout()">⎋ Завершить сессию</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const defaultAvatar="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' rx='50' fill='#303644'/><text x='50%' y='59%' text-anchor='middle' font-size='46'>🫵</text></svg>");
let profile=JSON.parse(localStorage.getItem("profile")||"{}"); let avatar=profile.avatar||""; let currentChat="";
function saveLocal(){profile={...profile,username:($("username").value||"").trim().replace(/^@/,""),displayName:($("displayName").value||"").trim(),bio:($("bio").value||"").trim(),email:($("email").value||"").trim(),avatar};localStorage.setItem("profile",JSON.stringify(profile));renderHeader()}
function renderHeader(){$("headName").textContent=profile.displayName||"Мой профиль";$("headSub").textContent=profile.username?"@"+profile.username:"Настрой профиль";$("headAvatar").src=avatar||defaultAvatar;$("pickAvatar").src=avatar||defaultAvatar}
function toggleMore(){$("moreMenu").style.display=$("moreMenu").style.display==="block"?"none":"block"}function closeMore(){$("moreMenu").style.display="none"}function openProfile(){closeMore();$("username").value=profile.username||"";$("displayName").value=profile.displayName||"";$("bio").value=profile.bio||"";$("email").value=profile.email||"";$("identityCode").textContent=profile.identityCode||"—";$("drawer").classList.add("open")}
function closeProfile(){$("drawer").classList.remove("open")}
function saveProfile(){saveLocal();closeProfile();go("chats")}function showRegister(){$("loginForm").style.display="none";$("registerForm").style.display="block"}
function showLogin(){$("loginForm").style.display="block";$("registerForm").style.display="none"}
function makeCode(){return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase().match(/.{1,4}/g).join("-")}
function logout(){localStorage.removeItem("sessionActive");closeMore();closeProfile();$("auth").style.display="flex";showLogin();$("authMsg").textContent="Сессия завершена на этом устройстве."}function registerAccount(){const u=$("regUser").value.trim().replace(/^@/,"").toLowerCase(),n=$("regName").value.trim(),e=$("regEmail").value.trim().toLowerCase(),p=$("regPass").value;if(!u||!e||!p){$("authMsg").textContent="Заполни юзер, почту и пароль.";return}const code=makeCode();profile={username:u,displayName:n,email:e,avatar:"",bio:"",identityCode:code};localStorage.setItem("profile",JSON.stringify(profile));localStorage.setItem("account",JSON.stringify({username:u,email:e,password:p,identityCode:code}));localStorage.setItem("sessionActive","1");$("auth").style.display="none";renderHeader();renderChats()}
function login(){const id=$("loginId").value.trim().replace(/^@/,"").toLowerCase(),p=$("loginPass").value,a=JSON.parse(localStorage.getItem("account")||"null");if(!a||p!==a.password||(id!==a.username&&id!==a.email)){$("authMsg").textContent="Неверные данные.";return}localStorage.setItem("sessionActive","1");$("auth").style.display="none";renderHeader();renderChats()}
function loginByCode(){const code=$("loginCode").value.trim().toUpperCase(),a=JSON.parse(localStorage.getItem("account")||"null");if(!a||code!==a.identityCode){$("authMsg").textContent="Неверный код.";return}localStorage.setItem("sessionActive","1");$("auth").style.display="none";renderHeader();renderChats()}
function togglePlus(){$("plusMenu").style.display=$("plusMenu").style.display==="block"?"none":"block"}function closePlus(){$("plusMenu").style.display="none"}function createAI(){closePlus();openChat("LLM7",true)}
function regenerateCode(){profile.identityCode=makeCode();localStorage.setItem("profile",JSON.stringify(profile));const a=JSON.parse(localStorage.getItem("account")||"null");if(a){a.identityCode=profile.identityCode;localStorage.setItem("account",JSON.stringify(a))}$("identityCode").textContent=profile.identityCode}
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{avatar=r.result;renderHeader()};r.readAsDataURL(f)}
function go(page){if(page==="search")renderSearch();else renderChats();document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));$(page==="search"?"nSearch":"nChats").classList.add("active")}
function renderChats(){$("view").innerHTML='<section class="screen"><div class="empty"><b>Пока пусто 🫵</b>Найди друга по юзу — и открой диалог.</div></section>'}
function renderSearch(){$("view").innerHTML='<section class="screen"><div class="search"><input id="q" placeholder="Найти по юзу…"><button class="btn" onclick="searchUsers()">Найти</button></div><div id="results" class="muted">Введи @username.</div></section>';setTimeout(()=>$("q").focus(),0)}
function searchUsers(){const q=($("q").value||"").trim().replace(/^@/,"").toLowerCase();const r=$("results");if(!q){r.textContent="Введи @username.";return}r.innerHTML='<div class="user" onclick="openFound(\''+q+'\')"><img class="avatar" src="'+defaultAvatar+'"><div><b>@'+q+'</b><div class="muted">Пользователь</div></div></div>'}
function openFound(u){$("view").innerHTML='<section class="profile"><img class="bigavatar" src="'+defaultAvatar+'"><h2>@'+u+'</h2><div class="muted">Профиль пользователя</div><br><button class="btn" onclick="openChat(\''+u+'\')">Написать</button></section>'}
function openChat(u,isAI=false){
currentChat=u;
$("view").innerHTML='<section id="messages"><div id="chatEmpty" class="empty"><b>@'+u+'</b><span style="display:inline-block;margin-top:8px;padding:4px 8px;background:#303643;border-radius:9px;font-size:11px">🤖 LLM7 подключён как внутренний ассистент</span><br>Здесь будет ваш диалог.</div></section>';
document.querySelector(".bottom").style.display="none";
const c=document.createElement("div");c.className="composer";c.innerHTML='<button class="attach" title="Фото">＋</button><input id="photoInput" type="file" accept="image/*" hidden><textarea id="text" placeholder="Написать сообщение…" rows="1"></textarea><button id="send">➤</button>';
document.querySelector(".app").appendChild(c);
const attach=c.querySelector(".attach"), photo=c.querySelector("#photoInput");
attach.onclick=()=>photo.click();
photo.onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>addPhotoMessage(r.result);r.readAsDataURL(f);photo.value=""};
$("send").onclick=()=>{const t=$("text").value.trim();if(t){addTextMessage(t);$("text").value=""}};
$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}});
}
function addTextMessage(t){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className="msg me";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить</button></div><div class="body"></div>';x.querySelector(".body").textContent=t;x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);scrollMessages()}
function addPhotoMessage(src){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className="msg me";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить фото</button></div><img alt="Фото сообщения">';x.querySelector("img").src=src;x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);scrollMessages()}
function deleteMessage(el){el.remove()}
function scrollMessages(){const m=$("messages");m.scrollTop=m.scrollHeight}
document.addEventListener("click",e=>{document.querySelectorAll(".msg.selected").forEach(m=>{if(!m.contains(e.target))m.classList.remove("selected")})});
document.addEventListener("contextmenu",e=>{const m=e.target.closest&&e.target.closest(".msg");if(!m)return;e.preventDefault();m.classList.toggle("selected")});
document.addEventListener("click",e=>{const m=e.target.closest&&e.target.closest(".msg");if(m&&!e.target.closest(".delete-btn"))m.classList.toggle("selected")});
renderHeader();if(localStorage.getItem("sessionActive")==="1"&&localStorage.getItem("account")){$("auth").style.display="none";renderChats()}else{$("auth").style.display="flex"}
document.addEventListener("click",e=>{const menu=$("moreMenu");if(menu&&menu.style.display==="block"&&!e.target.closest("#moreMenu")&&!e.target.closest("header .icon"))closeMore()});
</script>
</body></html>
