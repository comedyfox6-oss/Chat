<script id="push-bootstrap">
(function(){
  const PUSH_API="https://chatmes.comedyfox6.workers.dev";
  function b64ToUint8(s){const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
  async function setupPush(){
    if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)||!profile?.username)return;
    if(Notification.permission==="denied")return;
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      const cfg=await fetch(PUSH_API+"/api/push/config").then(r=>r.json());
      if(!cfg.publicKey)return;
      let sub=await reg.pushManager.getSubscription();
      if(!sub){if(Notification.permission==="default"){const p=await Notification.requestPermission();if(p!=="granted")return}sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8(cfg.publicKey)})}
      await fetch(PUSH_API+"/api/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:profile.username,subscription:sub.toJSON()})});
    }catch(e){console.warn("Push setup:",e)}
  }
  window.setupPush=setupPush;
})();
</script>

function makeAvatar(name,isAI=false,isGroup=false){const el=document.createElement("div");el.className="avatar";el.style.display="grid";el.style.placeItems="center";const src=getStoredAvatar(name);if(src){el.style.backgroundImage="url('"+src.replace(/'/g,"\\'")+"')";el.style.backgroundSize="cover";el.style.backgroundPosition="center";el.textContent="";return el}if(isGroup){el.textContent="Г"}else if(name==="Бузя"){el.textContent="/n";el.classList.add("buzy-avatar");el.style.setProperty("color","#4fe7ff","important");el.style.setProperty("-webkit-text-fill-color","#4fe7ff","important");el.style.setProperty("text-shadow","0 0 5px #24dfff,0 0 12px #079cff,0 0 20px #006eff","important")}else if(isAI){el.textContent="ИИ"}else{el.textContent="👤"}return el}
 let currentChatIsAI=false; let currentChatIsGroup=false; let aiProfiles=JSON.parse(localStorage.getItem("aiProfiles")||"[]"); let groups=JSON.parse(localStorage.getItem("groups")||"[]");

async function loadServerMessages(chatUsername){
  const chat=String(chatUsername||"").replace(/^@/,"").trim().toLowerCase();

  if(!chat||!me)return [];
  try{

  }catch(e){console.warn("Не удалось загрузить сообщения с сервера:",e);return []}
}
let chatSocket=null;
function closeChatSocket(){if(chatSocket){try{chatSocket.close()}catch{}chatSocket=null}}
function connectChatSocket(chatUsername){
  closeChatSocket();
  const me=String(profile.username||"").replace(/^@/,"").trim().toLowerCase();
  const other=String(chatUsername||"").replace(/^@/,"").trim().toLowerCase();
  if(!me||!other||currentChatIsAI||currentChatIsGroup)return;
  const room=[me,other].sort().join("__").replace(/[^a-zA-Z0-9_а-яё-]/gi,"").slice(0,64);
  try{
    chatSocket=new WebSocket("wss://chatmes.comedyfox6.workers.dev/ws?room="+encodeURIComponent(room));
    chatSocket.onopen=()=>{
      if(currentChat.toLowerCase()===other)syncServerChat(chatUsername);
    };
    chatSocket.onmessage=e=>{
      try{
        const packet=JSON.parse(e.data);
        if(packet?.type==="message_deleted"){
          const id=String(packet.messageId||"");
          const clientId=String(packet.clientId||"");
          const items=loadMessages(currentChat).filter(x=>x.serverId!==id&&(!clientId||x.clientId!==clientId)&&(!clientId||x.id!==clientId));
          saveMessages(currentChat,items);
          document.querySelectorAll("#messages .msg").forEach(el=>{if(el.dataset.serverId===id||(!id&&clientId&&el.dataset.localId===clientId))el.remove()});
          return;
        }
        if(packet?.type==="chat_deleted"){
          localStorage.removeItem(chatKey(currentChat));
          const empty=$("chatEmpty");if(empty)empty.style.display="block";
          document.querySelectorAll("#messages .msg").forEach(el=>el.remove());
          return;
        }
        const m=packet&&packet.message;
        if(!m||m.sender===me||currentChat.toLowerCase()!==other)return;
        addTextMessage(m.text,false,false);
        const items=loadMessages(currentChat);const last=items[items.length-1];
        if(last){last.serverId=m.id;last.sender=m.sender;last.mine=false;saveMessages(currentChat,items)}
      }catch(err){console.warn("WS message error:",err)}
    };
    chatSocket.onerror=()=>{};
    chatSocket.onclose=()=>{
      if(currentChat.toLowerCase()===other&&!currentChatIsAI&&!currentChatIsGroup){
        setTimeout(()=>{
          if(currentChat.toLowerCase()===other)connectChatSocket(chatUsername);
        },1500);
      }
    };
  }catch(e){console.warn("WS connect error:",e)}
}
async function syncServerChat(chatUsername){
  if(currentChatIsAI||currentChatIsGroup)return;
  const server=await loadServerMessages(chatUsername);
  if(!server.length)return;
  const local=loadMessages(chatUsername);
  const known=new Set(local.map(x=>x.serverId).filter(Boolean));
  for(const m of server){
    if(known.has(m.id))continue;
    const mine=m.sender===String(profile.username||"").toLowerCase();
    const localId=newLocalMessageId();
    local.push({id:localId,type:"text",text:m.text,from:"user",mine,sender:m.sender,serverId:m.id,createdAt:m.createdAt});
    if(currentChat.toLowerCase()===String(chatUsername).toLowerCase())addTextMessage(m.text,true,mine,m.id,localId);
  }
  saveMessages(chatUsername,local);
  if(currentChat.toLowerCase()===String(chatUsername).toLowerCase())scrollMessages();
}

function togglePlus(){const m=$("plusMenu"),b=document.querySelector('.bottom .nav[onclick="togglePlus()"]'),a=document.querySelector(".app");if(m.style.display==="block"){m.style.display="none";return}closeProfile();closeChatMenu();const r=b.getBoundingClientRect(),ar=a.getBoundingClientRect(),w=190;let left=r.left-ar.left+r.width/2-w/2;left=Math.max(8,Math.min(left,ar.width-w-8));m.style.left=left+"px";m.style.right="auto";m.style.bottom=(ar.bottom-r.top+9)+"px";m.style.display="block"}function closePlus(){$("plusMenu").style.display="none"}
async function createAI(){
  closePlus();

function addAudioMessage(src,name,mime,restoring=false,mine=true){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className=messageClass(mine)+" file-msg";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить файл</button></div><div class="file-card"><div class="file-kind">♫</div><div class="file-info"><b class="file-name"></b><audio controls preload="metadata"></audio></div></div>';x.querySelector(".file-name").textContent=name||"Музыка";x.querySelector("audio").src=src;x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);if(!restoring){const items=loadMessages(currentChat);items.push({type:"audio",src,name:name||"Музыка",mime:mime||"audio/*",from:"user",mine:true,sender:profile.username||""});saveMessages(currentChat,items)}scrollMessages()}
function addFileMessage(src,name,mime,size,restoring=false,mine=true){const empty=$("chatEmpty");if(empty)empty.remove();const x=document.createElement("div");x.className=messageClass(mine)+" file-msg";x.innerHTML='<div class="msg-actions"><button class="delete-btn">Удалить файл</button></div><a class="file-card" target="_blank" rel="noopener"><div class="file-kind">▤</div><div class="file-info"><b class="file-name"></b><span class="file-size"></span></div><span class="file-open">Открыть</span></a>';const a=x.querySelector("a");a.href=src;x.querySelector(".file-name").textContent=name||"Документ";x.querySelector(".file-size").textContent=size?formatFileSize(size):"Документ";x.querySelector(".delete-btn").onclick=()=>deleteMessage(x);$("messages").appendChild(x);if(!restoring){const items=loadMessages(currentChat);items.push({type:"file",src,name:name||"Документ",mime:mime||"application/octet-stream",from:"user",mine:true,sender:profile.username||""});saveMessages(currentChat,items)}scrollMessages()}
function formatFileSize(bytes){if(!bytes)return"";const units=["Б","КБ","МБ","ГБ"];let n=bytes,i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return(n>=10||i===0?n.toFixed(0):n.toFixed(1))+" "+units[i]}
function deleteMessage(el){
  if(!el)return;
  el.classList.remove("selected");
  const items=loadMessages(currentChat);
  const localId=el.dataset.localId||"";
  const index=localId?items.findIndex(item=>item&&item.id===localId):[...$("messages").children].filter(x=>x.classList.contains("msg")).indexOf(el);
  const item=index>=0?items[index]:null;
  const serverId=el.dataset.serverId||item?.serverId||"";
  const clientId=item?.clientId||el.dataset.localId||"";
  const finish=()=>{
    el.remove();
    if(index>=0){items.splice(index,1);saveMessages(currentChat,items)}
    if(!$("messages").querySelector(".msg")){const empty=$("chatEmpty");if(empty)empty.style.display="block"}
  };
  finish();
}
function scrollMessages(){const m=$("messages");m.scrollTop=m.scrollHeight}
document.addEventListener("click",e=>{document.querySelectorAll(".msg.selected").forEach(m=>{if(!m.contains(e.target))m.classList.remove("selected")})});
document.addEventListener("contextmenu",e=>{const m=e.target.closest&&e.target.closest(".msg");if(!m)return;e.preventDefault();m.classList.toggle("selected")});
document.addEventListener("click",e=>{const m=e.target.closest&&e.target.closest(".msg");if(m&&!e.target.closest(".delete-btn"))m.classList.toggle("selected")});document.addEventListener("pointerdown",e=>{const m=e.target.closest&&e.target.closest(".msg");if(!m)return;clearTimeout(m._pressTimer);m._pressTimer=setTimeout(()=>m.classList.add("selected"),450)});document.addEventListener("pointerup",e=>{const m=e.target.closest&&e.target.closest(".msg");if(m)clearTimeout(m._pressTimer)});
renderHeader();const savedAccount=readAccount();const sessionActive=localStorage.getItem("sessionActive")==="1";if(savedAccount&&sessionActive){finishLogin(savedAccount)}else{$("auth").style.display="flex";showLogin()}

</script>
<script id="theme-script">
(function(){const dark=localStorage.getItem("theme")==="dark";document.documentElement.classList.toggle("dark",dark)})();
function toggleTheme(){const dark=document.documentElement.classList.toggle("dark");localStorage.setItem("theme",dark?"dark":"light")}
</script></body></html>
